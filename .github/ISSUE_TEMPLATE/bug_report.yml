name: Bug report
description: Report a reproducible problem with gcp-free-deploy
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove project IDs, credentials, tokens,
        Terraform state, IP addresses, and other sensitive values before posting.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: I removed credentials, project IDs, Terraform state, IP addresses, and other sensitive values.
          required: true

  - type: input
    id: version
    attributes:
      label: gcp-free-deploy version
      description: Run `gcp-free-deploy version` or provide the source commit.
      placeholder: v1.2.3 or commit SHA
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 amd64, macOS 15 arm64, or Windows 11 amd64
    validations:
      required: true

  - type: input
    id: tool_versions
    attributes:
      label: Terraform and Google Cloud CLI versions
      description: Include only the tools involved in the problem.
      placeholder: Terraform 1.13.x; gcloud 5xx.x.x

  - type: dropdown
    id: source
    attributes:
      label: Deployment source
      options:
        - Docker image
        - Public GitHub repository
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Choose ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Paste only the relevant, redacted output. Do not upload Terraform state or credentials.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that may help, including whether cleanup completed safely.
