name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                goos: [linux, windows, darwin]
                goarch: [amd64, arm64]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: false

            - name: Test
              run: go test ./...

            - name: Build binaries
              run: |
                  mkdir -p dist
                  GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
                    go build -o dist/gcp-free-deploy-${{ matrix.goos }}-${{ matrix.goarch }} .

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: gcp-free-deploy-${{ matrix.goos }}-${{ matrix.goarch }}
                  path: dist/*

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/**
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
